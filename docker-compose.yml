services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-clinic
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - mongodb
    networks:
      - clinic-network

  mongodb:
    image: mongo:7.0
    container_name: clinic-mongodb
    restart: always
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - clinic-network

networks:
  clinic-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
